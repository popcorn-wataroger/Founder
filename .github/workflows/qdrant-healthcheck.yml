name: Qdrant Healthcheck

on:
  schedule:
    # 毎週月曜 00:00 UTC（日本時間 月曜 9:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:

# GitHub API を呼ばないジョブなので GITHUB_TOKEN の権限は与えない
permissions: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Qdrant collection
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          COLLECTION: sources
        run: |
          set -euo pipefail

          status=$(curl -sS --connect-timeout 10 --max-time 20 \
            -o body.json -w '%{http_code}' \
            -H "api-key: ${QDRANT_API_KEY}" \
            "${QDRANT_URL%/}/collections/${COLLECTION}") || {
              echo "::error::Qdrant への接続自体が失敗しました（タイムアウトまたはDNSエラー）。"
              exit 1
            }

          echo "HTTP status: ${status}"

          if [ "${status}" != "200" ]; then
            echo "::error::Qdrant に接続できませんでした（HTTP ${status}）。クラスターが休止している可能性があります。"
            exit 1
          fi

          if ! points=$(jq -er '.result.points_count' body.json); then
            echo "::error::レスポンスから points_count を取得できませんでした。JSON形式が想定と異なります。"
            exit 1
          fi

          echo "points_count: ${points}"

          if [ "${points}" -le 0 ]; then
            echo "::error::コレクション ${COLLECTION} が空です（points_count=${points}）。データが失われている可能性があります。"
            exit 1
          fi

          echo "Qdrant は正常です（points_count=${points}）"
