name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen
      - name: mypy
        run: uv run mypy app/

  test:
    name: Test & Smoke Test
    runs-on: ubuntu-latest
    # テストは本番と同じ PostgreSQL に対して実行する（SQLiteとの二重サポートはしない）。
    # service コンテナは job と同じネットワークで起動するので localhost:5432 で繋がる
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: founder
          POSTGRES_PASSWORD: founder
          POSTGRES_DB: founder_test
        ports: ['5432:5432']
        # DBが受け付けられる状態になるまで step を始めない
        # （起動直後に接続しにいくと connection refused で落ちるため）
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # app/vectorizer.py が import 時に genai.Client を生成するため、値が空だと
      # テスト収集前に ValueError で落ちる。CIでは実際のAPIを呼ばないのでダミーで足りる
      GEMINI_API_KEY: dummy-key-for-ci
      QDRANT_URL: http://localhost:6333
      FRONTEND_URL: http://localhost:8000
      APP_ENV: test
      # 上の service コンテナへの接続先。app/database.py はこの値だけを見る
      DATABASE_URL: postgresql://founder:founder@localhost:5432/founder_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pytest
        run: uv run pytest -q --tb=short
      - name: Smoke test
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/ && echo "OK" && break
            sleep 1
          done || (echo "Smoke test failed: server did not respond" && exit 1)
